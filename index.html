/* ---------- Abend-Check: Morgen vorbereiten ---------- */
const eveningActive = () => state.settings.evening && nowMin() >= toMin(state.settings.eveningTime);
// Offene Aufgaben bis heute, die sich auf morgen schieben lassen (Routinen, die morgen ohnehin wiederkommen, nicht)
function movableToTomorrow() {
  const t = todayStr(), tm = addDays(t, 1);
  return state.tasks.filter((x) => {
    if (x.done || !x.due || x.due > t) return false;
    const r = x.routineId && state.routines.find((y) => y.id === x.routineId);
    return !(r && ruleMatches(r, tm));
  });
}
function tomorrowSummary() {
  const tm = addDays(todayStr(), 1);
  const first = eventsOn(tm).find((e) => e.start);
  const dep = firstDeparture(tm);
  const prep = state.tasks.filter((x) => !x.done && (x.due === tm || x.planDate === tm)).length;
  const parts = [];
  if (first) parts.push(`1. Termin ${first.start} ${first.title}`);
  if (dep) parts.push(`los ${fmtTime(dep.la)}`);
  if (prep) parts.push(`${prep} vorzubereiten`);
  return parts.join(' · ') || 'Morgen ist noch nichts geplant';
}
function eveningHtml() {
  const t = todayStr(), tm = addDays(t, 1);
  const evs = eventsOn(tm);
  const items = timedItems(tm).filter((it) => !(it.kind === 'task' && it.ref.done));
  const allDay = evs.filter((e) => !e.start);
  const open = state.tasks.filter((x) => !x.done);
  const prep = open.filter((x) => x.due === tm || x.planDate === tm).sort(byTaskOrder);
  const leftToday = open.filter((x) => x.due && x.due <= t).sort(byTaskOrder);
  const dep = firstDeparture(tm);
  const taskRow = (x) => `<li><button type="button" class="bl" data-open-task="${esc(x.id)}"><span class="bt"><span class="pill prio-${x.prio}">${PRIO[x.prio]}</span></span><span class="bx">${esc(x.title)}${x.checklist.length ? ` <span class="${x.checklist.every((c) => c.done) ? 'ok' : 'muted'}">· ${x.checklist.filter((c) => c.done).length}/${x.checklist.length}</span>` : ''}${x.due && x.due < t ? ' <span class="warn">· überfällig</span>' : ''}</span></button></li>`;
  let html = `<div class="brief"><div class="kpis">
    <div class="kpi"><b>${evs.length}</b><span>Termine</span></div>
    <div class="kpi"><b>${prep.length}</b><span>vorbereiten</span></div>
    <div class="kpi${leftToday.length ? ' alert' : ''}"><b>${leftToday.length}</b><span>heute offen</span></div>
    <div class="kpi"><b>${open.filter((x) => x.prio === 'muss').length}</b><span>Muss offen</span></div></div>`;
  if (evs.some(missingTravel)) html += `<h4 class="warn">Achtung</h4><ul>${missingRows(evs)}</ul>`;
  if (dep) html += `<h4>Aufbruch morgen</h4><ul>${state.settings.preAlert ? `<li><span class="bt">${fmtTime(preTime(dep.la))}</span><span class="bx muted">Vorwarnung – fertig machen</span></li>` : ''}<li><span class="bt"><b>${fmtTime(dep.la)}</b></span><span class="bx">→ ${esc(dep.ev.title)}${dep.ev.location ? ' · ' + esc(dep.ev.location) : ''}</span></li></ul>`;
  html += `<h4>Ablauf morgen</h4>`;
  const rows = [...allDay.map((e) => `<li><span class="bt">ganztägig</span><span class="bx">${esc(e.title)}</span></li>`),
    ...items.slice(0, 10).map((it) => `<li><span class="bt">${esc(it.label)}</span><span class="bx">${it.kind === 'task' ? '☐ ' : ''}${esc(it.ref.title)}</span></li>`)];
  html += rows.length ? `<ul>${rows.join('')}</ul>` : `<p class="muted">Keine festen Termine.</p>`;
  html += `<h4>Vorbereiten</h4>`;
  html += prep.length ? `<ul>${prep.slice(0, 8).map(taskRow).join('')}</ul>` : `<p class="muted">Für morgen ist nichts fällig.</p>`;
  if (leftToday.length) {
    const nMove = movableToTomorrow().length;
    html += `<h4>Heute noch offen</h4><ul>${leftToday.slice(0, 6).map(taskRow).join('')}</ul>${leftToday.length > 6 ? `<p class="muted small">+${leftToday.length - 6} weitere</p>` : ''}
      ${nMove ? `<button type="button" class="btn block" style="margin-top:8px" data-move>${icon('right', 'sm')} ${nMove === 1 ? 'Auf morgen verschieben' : `${nMove} Aufgaben auf morgen verschieben`}</button>` : ''}
      ${nMove < leftToday.length ? `<p class="muted small">Routine-Aufgaben, die morgen ohnehin wiederkommen, bleiben stehen.</p>` : ''}`;
  }
  return html + '</div>';
}
function showEvening() {
  const sheet = openSheet(`${sheetHead('Morgen vorbereiten')}<div class="sheet-body"><p class="muted" style="margin:0 0 8px">${esc(fmtLong(addDays(todayStr(), 1)))}</p>${eveningHtml()}</div>
    <div class="sheet-foot"><button type="button" class="btn primary" data-go>Fertig – gute Nacht</button></div>`);
  sheet.querySelector('[data-go]').onclick = () => closeSheet();
  sheet.querySelector('.sheet-body').onclick = (e) => {
    const o = e.target.closest('[data-open-task]');
    if (o) { editTask(o.dataset.openTask); return; }
    const oe = e.target.closest('[data-open-event]');
    if (oe) { openEvent(oe.dataset.openEvent); return; }
    if (e.target.closest('[data-move]')) {
      const tm = addDays(todayStr(), 1);
      const moved = movableToTomorrow();
      for (const x of moved) x.due = tm;
      save(); render(); showEvening();
      toast(`${moved.length} Aufgabe${moved.length > 1 ? 'n' : ''} auf morgen verschoben`);
    }
  };
}
function maybeEvening() {
  const t = todayStr();
  const st = state.settings;
  if (!st.evening || st.lastEvening === t || !eveningActive()) return;
  if (!(state.tasks.length + state.events.length + state.routines.length)) return;
  if (document.hidden) {
    // App läuft im Hintergrund: einmal per Systembenachrichtigung erinnern
    if (st.lastEveningNote !== t && 'Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
      st.lastEveningNote = t; save();
      navigator.serviceWorker.ready.then((reg) => reg.showNotification('Abend-Check: Morgen vorbereiten', { body: tomorrowSummary(), tag: 'kz-evening', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' })).catch(() => {});
    }
    return;
  }
  if (!sheetRoot.hidden || !$('#alarm').hidden) return;
  st.lastEvening = t; save();
  showEvening();
}

/* ---------- Kalenderdatei (.ics, lokal erzeugt) ---------- */
function buildIcs(ev) {
  const icsEsc = (x) => String(x || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const dt = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const n = new Date();
  const stamp = `${n.getUTCFullYear()}${pad(n.getUTCMonth() + 1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}${pad(n.getUTCSeconds())}Z`;
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kommandozentrum//DE', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', `UID:${ev.id}@kommandozentrum.local`, `DTSTAMP:${stamp}`];
  const s = eventStart(ev);
  if (s) {
    let e = ev.end ? toDateTime(ev.date, ev.end) : new Date(s.getTime() + 3600000);
    if (e <= s) e = new Date(s.getTime() + 3600000);
    lines.push(`DTSTART:${dt(s)}`, `DTEND:${dt(e)}`);
  } else {
    lines.push(`DTSTART;VALUE=DATE:${ev.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(ev.date, 1).replace(/-/g, '')}`);
  }
  lines.push(`SUMMARY:${icsEsc(ev.title)}`);
  if (ev.location) lines.push(`LOCATION:${icsEsc((findPlace(ev.location) || {}).address || ev.location)}`);
  if (ev.notes) lines.push(`DESCRIPTION:${icsEsc(ev.notes)}`);
  if (s && ev.location && ev.alarm) {
    const pre = state.settings.preAlert;
    if (pre) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`In ${pre} min losfahren: ${ev.title}`)}`, `TRIGGER:-PT${travelMin(ev) + pre}M`, 'END:VALARM');
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc('Losfahren: ' + ev.title)}`, `TRIGGER:-PT${travelMin(ev)}M`, 'END:VALARM');
  }
  lines.push('END:VEVENT', 'END:VCALENDAR');
  // Zeilen > 75 Zeichen falten (RFC 5545)
  return lines.map((l) => { let out = ''; while (l.length > 74) { out += l.slice(0, 74) + '\r\n '; l = l.slice(74); } return out + l; }).join('\r\n') + '\r\n';
}

/* ---------- Losfahr-Alarm ---------- */
function checkAlarms() {
  const now = Date.now();
  const pre = state.settings.preAlert * 60000;
  let changed = false;
  for (const ev of alarmCandidates()) {
    if (!ev.alarm) continue;
    const la = leaveAt(ev); if (!la) continue;
    const t = la.getTime();
    const key = String(t);
    if (now >= t) {
      if (state.fired[ev.id] !== key && now - t < ALARM_WINDOW_MIN * 60000) { state.fired[ev.id] = key; changed = true; fireAlarm(ev, la); }
    } else if (pre && now >= t - pre && state.fired[ev.id + '#pre'] !== key) {
      state.fired[ev.id + '#pre'] = key; changed = true; fireAlarm(ev, la, 'pre');
    }
  }
  // Einträge älter als 3 Tage aufräumen
  for (const [id, v] of Object.entries(state.fired)) if (Number(v) < now - 3 * 86400000) { delete state.fired[id]; changed = true; }
  if (changed) save();
  scheduleNextCheck();
}
let alarmTimer;
function scheduleNextCheck() {
  clearTimeout(alarmTimer);
  const now = Date.now();
  let next = Infinity;
  for (const ev of alarmCandidates()) {
    if (!ev.alarm) continue;
    const la = leaveAt(ev); if (!la) continue;
    const t = la.getTime(), p = t - state.settings.preAlert * 60000;
    if (p > now) next = Math.min(next, p); else if (t > now) next = Math.min(next, t);
  }
  if (next !== Infinity) alarmTimer = setTimeout(checkAlarms, Math.min(next - now + 200, 2 ** 31 - 1));
}
function beep(short) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC();
    (short ? [0, 0.35] : [0, 0.35, 0.7, 1.4, 1.75, 2.1]).forEach((t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.type = 'square';
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.25);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
    setTimeout(() => ctx.close(), 3000);
  } catch (_) {}
}
function fireAlarm(ev, la, mode = 'main') {
  const isPre = mode === 'pre';
  const late = mode === 'main' && Date.now() - la.getTime() > 2 * 60000;
  const el = $('#alarm');
  el.classList.toggle('pre', isPre);
  el.innerHTML = `<div class="a-label">${mode === 'test' ? 'Test-Alarm' : isPre ? `Fertig machen · losfahren ${fmtRel(la - Date.now())}` : late ? 'Aufbruch verpasst' : 'Jetzt losfahren'}</div>
    <div class="a-time">${fmtTime(la)}</div>
    <div class="a-title">${esc(ev.title)}</div>
    <div class="a-loc">${esc(ev.location)} · Beginn ${esc(ev.start)} · ${esc(travelText(ev))}</div>
    <a class="btn primary block" href="${esc(mapsUrl(ev.location))}" target="_blank" rel="noopener noreferrer" data-a="nav">${icon('nav')} Navigation starten</a>
    <button class="btn block" data-a="close">Schließen</button>`;
  el.hidden = false;
  el.onclick = (e) => { const b = e.target.closest('[data-a]'); if (b) { el.hidden = true; render(); } };
  beep(isPre);
  if (navigator.vibrate) navigator.vibrate(isPre ? [300, 150, 300] : [400, 200, 400, 200, 800]);
  if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
    navigator.serviceWorker.ready.then((reg) => reg.showNotification(isPre ? `Fertig machen: ${ev.title}` : `Losfahren: ${ev.title}`, {
      body: `${isPre ? 'Losfahren um ' : ''}${fmtTime(la)} · ${ev.location} · Beginn ${ev.start}`, tag: (isPre ? 'kz-pre-' : 'kz-') + ev.id, renotify: true, requireInteraction: !isPre, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png'
    })).catch(() => {});
  }
}
async function askNotify() {
  if (!('Notification' in window)) { toast(isIOS() ? 'Erst „Zum Home-Bildschirm“ hinzufügen, dann erneut versuchen' : 'Nicht unterstützt'); return; }
  const r = await Notification.requestPermission();
  toast(r === 'granted' ? 'Benachrichtigungen erlaubt' : 'Nicht erlaubt');
  if (view === 'mehr') render();
}

/* ---------- Export / Import ---------- */
async function deriveKey(pw, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function exportBackup() {
  const withAtt = $('#exp-att').checked;
  const encrypt = $('#exp-enc').checked;
  let pw = '';
  if (encrypt) {
    pw = $('#exp-pw1').value;
    if (pw.length < 8) { toast('Passwort: mindestens 8 Zeichen'); return; }
    if (pw !== $('#exp-pw2').value) { toast('Passwörter stimmen nicht überein'); return; }
    if (!crypto.subtle) { toast('Verschlüsselung nur über HTTPS verfügbar'); return; }
  }
  toast(encrypt ? 'Verschlüssele …' : 'Erzeuge Backup …');
  try {
    state.settings.lastExport = Date.now();
    const payload = { app: 'kommandozentrum', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), state, attachments: null };
    if (withAtt) payload.attachments = (await Files.all()).map((f) => ({ id: f.id, ownerType: f.ownerType, ownerId: f.ownerId, name: f.name, type: f.type, size: f.size, created: f.created, data: bufToB64(f.data) }));
    let out;
    if (encrypt) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(pw, salt, PBKDF2_ITER);
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(payload)));
      out = { format: BACKUP_FORMAT, formatVersion: 1, encrypted: true, kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: PBKDF2_ITER, salt: bufToB64(salt) }, cipher: { name: 'AES-GCM', iv: bufToB64(iv) }, data: bufToB64(ct) };
    } else {
      out = { format: BACKUP_FORMAT, formatVersion: 1, encrypted: false, payload };
    }
    save();
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const name = `kommandozentrum-backup-${todayStr()}${encrypt ? '-verschluesselt' : ''}.json`;
    if ($('#exp-pw1')) { $('#exp-pw1').value = ''; $('#exp-pw2').value = ''; }
    offerFile(blob, name, `${withAtt ? 'mit' : 'ohne'} Anhänge${encrypt ? ', verschlüsselt' : ', unverschlüsselt'}`);
  } catch (e) { toast('Export fehlgeschlagen: ' + (e && e.message || e)); }
}
function askPassword(title) {
  return new Promise((resolve) => {
    let done = false;
    const sheet = openSheet(`<form novalidate>${sheetHead(title)}<div class="sheet-body">
      <label class="field"><span>Passwort</span><input type="password" name="pw" autocomplete="current-password"></label></div>
      <div class="sheet-foot"><button type="submit" class="btn primary">Entschlüsseln</button></div></form>`, () => { if (!done) resolve(null); });
    const form = sheet.querySelector('form');
    setTimeout(() => form.elements.pw.focus(), 250);
    form.onsubmit = (e) => { e.preventDefault(); done = true; const v = form.elements.pw.value; closeSheet(true); resolve(v); };
  });
}
async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (_) { toast('Keine gültige JSON-Datei'); return; }
  if (!obj || obj.format !== BACKUP_FORMAT) { toast('Unbekanntes Backup-Format'); return; }
  let payload;
  if (obj.encrypted) {
    const pw = await askPassword('Backup entschlüsseln');
    if (pw == null) return;
    toast('Entschlüssele …');
    try {
      const key = await deriveKey(pw, b64ToBuf(obj.kdf.salt), Number(obj.kdf.iterations) || PBKDF2_ITER);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(obj.cipher.iv) }, key, b64ToBuf(obj.data));
      payload = JSON.parse(new TextDecoder().decode(pt));
    } catch (_) { toast('Falsches Passwort oder beschädigte Datei'); return; }
  } else payload = obj.payload;
  if (!payload || !payload.state) { toast('Backup enthält keine Daten'); return; }
  const s = normalize(payload.state);
  const atts = Array.isArray(payload.attachments) ? payload.attachments : null;
  const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('de-DE') : 'unbekannt';
  if (!confirm(`Backup vom ${when} importieren?\n\n${s.tasks.length} Aufgaben, ${s.events.length} Termine, ${s.routines.length} Routinen, ${s.templates.length} Vorlagen, ${s.places.length} Orte${atts ? `, ${atts.length} Anhänge` : ' (ohne Anhänge)'}.\n\nDie aktuellen Daten auf diesem Gerät werden ERSETZT.`)) return;
  try {
    if (atts) {
      await Files.clear();
      for (const a of atts) {
        if (!a || typeof a.id !== 'string' || typeof a.data !== 'string') continue;
        await Files.put({ id: a.id, ownerType: str(a.ownerType, 10), ownerId: str(a.ownerId, 80), name: str(a.name, 200) || 'Datei', type: str(a.type, 100) || 'application/octet-stream', size: Number(a.size) || 0, created: Number(a.created) || Date.now(), data: b64ToBuf(a.data) });
      }
    } else {
      // Backup ohne Anhänge: vorhandene Anhänge behalten, sofern ihr Eintrag noch existiert
      const ids = new Set([...s.tasks.map((t) => t.id), ...s.events.map((e) => e.id), ...s.routines.map((r) => r.id)]);
      for (const f of await Files.all()) if (!ids.has(f.ownerId)) await Files.del(f.id);
    }
  } catch (e) { toast('Anhänge konnten nicht importiert werden: ' + (e && e.message || e)); }
  state = s;
  generateRoutineTasks();
  save();
  await refreshAttCounts();
  scheduleNextCheck();
  render(); toast('Import abgeschlossen');
}
async function wipeAll() {
  if (!confirm('Wirklich ALLE Aufgaben, Termine, Routinen, Vorlagen, Orte und Anhänge auf diesem Gerät löschen?')) return;
  if (!confirm('Letzte Warnung: Das kann nicht rückgängig gemacht werden. Vorher exportiert?')) return;
  state = defaultState();
  state.settings.lastBrief = todayStr();
  try { await Files.clear(); } catch (_) {}
  for (const k of Object.keys(localStorage)) if (k.startsWith('kz:')) localStorage.removeItem(k);
  save();
  await refreshAttCounts();
  setView('heute'); toast('Alle Daten gelöscht');
}

document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });
$('#fab').addEventListener('click', () => quickEntry({ baseDate: view === 'plan' && state.settings.planMode === 'tag' ? planDate : '' }));
$('#hdr-btn').addEventListener('click', showBrief);
main.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const taskId = b.closest('[data-task]')?.dataset.task;
  const evId = b.closest('[data-event]')?.dataset.event;
  switch (act) {
    case 'toggle-task': toggleTask(taskId); break;
    case 'edit-task': editTask(taskId); break;
    case 'edit-event': if (evId.includes('@')) occurrenceMenu(evId); else editEvent(evId); break;
    case 'task-cat': state.settings.taskCat = b.dataset.cat; save(); render(); break;
    case 'toggle-done': state.settings.showDone = !state.settings.showDone; save(); render(); break;
    case 'toggle-past': state.settings.showPast = !state.settings.showPast; save(); render(); break;
    case 'purge-done': {
      const cat = state.settings.taskCat;
      const del = state.tasks.filter((t) => t.done && (cat === 'alle' || t.cat === cat));
      if (!del.length || !confirm(`${del.length} erledigte Aufgaben inkl. Anhänge endgültig löschen?`)) break;
      state.tasks = state.tasks.filter((t) => !del.includes(t));
      save(); Promise.all(del.map((t) => Files.delOwner(t.id))).then(refreshAttCounts).then(render); render(); break;
    }
    case 'plan-mode': state.settings.planMode = b.dataset.mode; save(); render(); break;
    case 'plan-shift': planDate = addDays(planDate, Number(b.dataset.n)); render(); break;
    case 'plan-today': planDate = todayStr(); render(); break;
    case 'goto-day': planDate = b.dataset.date; state.settings.planMode = 'tag'; save(); setView('plan'); break;
    case 'goto-mehr': setView('mehr'); break;
    case 'tl-new': {
      if (e.target !== b) break;   // nur freie Fläche, nicht Einträge
      const rect = b.getBoundingClientRect();
      const m = Number(b.dataset.minh) * 60 + (e.clientY - rect.top) / PX_PER_MIN;
      newAt(b.dataset.date, fromMin(Math.max(0, Math.min(23 * 60 + 45, Math.floor(m / 15) * 15))));
      break;
    }
    case 'edit-routine': editRoutine(b.dataset.id); break;
    case 'new-routine': {
      const rule = cleanRule({ freq: 'weekly' }, todayStr());
      if (b.dataset.kind === 'event') editEvent(null, { prefill: { rule } }); else editTask(null, { prefill: { rule } });
      break;
    }
    case 'edit-template': editTemplate(b.dataset.id); break;
    case 'new-template': editTemplate(null); break;
    case 'apply-template': applyTemplate(b.dataset.id); break;
    case 'example-templates': state.templates.push(...EXAMPLE_TEMPLATES.map((t) => cleanTemplate({ ...t, id: uid() }))); save(); render(); toast('3 Beispielvorlagen geladen'); break;
    case 'show-brief': showBrief(); break;
    case 'show-evening': showEvening(); break;
    case 'show-missing': showMissing(); break;
    case 'edit-place': editPlace(b.dataset.id); break;
    case 'new-place': editPlace(null); break;
    case 'ask-notify': askNotify(); break;
    case 'test-alarm': fireAlarm({ title: 'Test-Termin', location: 'Beispielort', start: fmtTime(new Date(Date.now() + 1800000)), buffer: 30 }, new Date(), 'test'); break;
    case 'export': exportBackup(); break;
    case 'wipe': wipeAll(); break;
    case 'persist': navigator.storage?.persist?.().then((ok) => { toast(ok ? 'Dauerhafter Speicher aktiv' : 'Vom Browser abgelehnt'); renderStorage(); }); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#viewer').hidden) $('#viewer [data-v=close]')?.click();
  else if (!sheetRoot.hidden) closeSheet();
});
let lastDay = todayStr();
function onTick(force) {
  const t = todayStr();
  if (t !== lastDay) { lastDay = t; if (planDate < t) planDate = t; generateRoutineTasks(); force = true; }
  checkAlarms();
  maybeBrief();
  maybeEvening();
  if (sheetRoot.hidden && (force || view === 'heute' || view === 'plan')) render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) onTick(true); });
window.addEventListener('storage', (e) => { if (e.key === LS_KEY) { state = load(); render(); } });
setInterval(() => onTick(false), 30000);

/* ---------- Service Worker ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
    const offer = (w) => toast('Neue Version verfügbar', { label: 'Aktualisieren', fn: () => w.postMessage('skipWaiting') });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch(() => {});
  // Nur nach einem Update neu laden, nicht bei der Erstinstallation.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}

/* ---------- Start ---------- */
generateRoutineTasks();
render();
refreshAttCounts().then(() => { if (sheetRoot.hidden) render(); });
checkAlarms();
maybeBrief();
maybeEvening();
</script>
</body>
</html>
