<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Datenschutz: connect-src 'none' verhindert jede Netzwerkanfrage aus der Seite (kein fetch/XHR/Beacon/WebSocket).
     Keine externen Skripte, Schriften oder Bilder. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src blob:; object-src 'none'; connect-src 'none'; font-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kommando">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kommandozentrum</title>
<style>
:root {
  --bg: #0b0d10;
  --surface: #14171c;
  --surface-2: #1c2027;
  --surface-3: #262b34;
  --line: #2a2f38;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #4f9cff;
  --accent-ink: #06121f;
  --muss: #ff5d5d;
  --soll: #ffb547;
  --kann: #7aa2c8;
  --dienst: #4f9cff;
  --lernen: #b48cff;
  --training: #3ddc97;
  --privat: #ff7ab6;
  --ok: #3ddc97;
  --warn: #ff5d5d;
  --radius: 16px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 88px);
  overscroll-behavior-y: contain;
}
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; }

/* Kopf */
.top { position: sticky; top: 0; z-index: 5; padding: calc(var(--safe-t) + 14px) 18px 12px; background: linear-gradient(var(--bg) 75%, rgba(11,13,16,0)); }
.top h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
.top .sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
main { padding: 4px 14px 0; max-width: 720px; margin: 0 auto; }

/* Abschnitte & Listen */
.section { margin: 24px 0 8px; }
.section-h { margin: 0 4px 8px; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.list { display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); padding: 18px 14px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); font-size: 15px; }
.empty .btn { margin-top: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card p { margin: 0 0 12px; }

/* Einträge */
.item { display: flex; align-items: stretch; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 60px; overflow: hidden; }
.item .item-main { flex: 1; min-width: 0; padding: 10px 4px 10px 0; display: flex; flex-direction: column; justify-content: center; background: none; border: 0; text-align: left; }
.item .item-title { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; color: var(--muted); font-size: 13px; align-items: center; }
.item .meta span { display: inline-flex; align-items: center; gap: 4px; }
.item.task { border-left: 4px solid var(--kann); }
.item.task.prio-muss { border-left-color: var(--muss); }
.item.task.prio-soll { border-left-color: var(--soll); }
.item.done { opacity: 0.55; }
.item.done .item-title { text-decoration: line-through; color: var(--muted); }
.item.past { opacity: 0.55; }
.check { flex: none; width: 52px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.check .box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center; color: var(--accent-ink); }
.item.done .check .box { background: var(--ok); border-color: var(--ok); }
.time-col { flex: none; width: 64px; padding: 10px 0 10px 12px; display: flex; flex-direction: column; justify-content: center; font-variant-numeric: tabular-nums; }
.time-col .t-start { font-weight: 700; font-size: 16px; }
.time-col .t-end { color: var(--muted); font-size: 13px; }
.time-col .t-all { color: var(--muted); font-size: 13px; font-weight: 600; }
.nav-btn { flex: none; width: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--surface-2); color: var(--accent); border-left: 1px solid var(--line); text-decoration: none; font-size: 11px; font-weight: 700; }
.pill { border-radius: 8px; padding: 1px 7px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text); }
.pill.prio-muss { color: var(--muss); } .pill.prio-soll { color: var(--soll); } .pill.prio-kann { color: var(--kann); }
.pill.cat-dienst { color: var(--dienst); } .pill.cat-lernen { color: var(--lernen); } .pill.cat-training { color: var(--training); } .pill.cat-privat { color: var(--privat); }
.warn { color: var(--warn) !important; font-weight: 600; }
.ok { color: var(--ok) !important; font-weight: 600; }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 15px; font-weight: 600; min-height: 42px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.toggle-row { display: flex; justify-content: center; margin: 10px 0; }
.link-btn { background: none; border: 0; color: var(--accent); padding: 10px 6px; font-size: 15px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.link-btn.danger { color: var(--warn); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 16px; text-decoration: none; color: var(--text); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--text); flex: none; }

/* Plus & Tabs */
.fab { position: fixed; right: 18px; bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px); width: 62px; height: 62px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); border: 0; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 6; }
.fab svg.i { width: 30px; height: 30px; stroke-width: 2.6; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(16,18,22,0.96); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.tabs button { height: var(--tabbar-h); background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; }
.tabs button.on { color: var(--text); }
.tabs button.on svg { color: var(--accent); }

/* Sheets */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20; animation: fade .15s ease-out; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); animation: up .2s ease-out; max-width: 720px; margin: 0 auto; }
.sheet form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 20px; }
.sheet-body { overflow-y: auto; overflow-x: hidden; padding: 6px 16px 12px; -webkit-overflow-scrolling: touch; }
.sheet-foot { display: flex; gap: 10px; padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1; }
.sheet-foot .btn.danger { flex: 0 0 auto; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 0 calc(12px + var(--safe-b)); }
.choice .btn { min-height: 88px; flex-direction: column; font-size: 17px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Formulare */
.field { display: block; margin: 12px 0; }
.field > span, .field-label { display: block; color: var(--muted); font-size: 13px; font-weight: 600; margin: 0 2px 6px; }
.inp, .field input:not([type=radio]):not([type=checkbox]), .field textarea {
  width: 100%; min-width: 0; min-height: 50px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; outline: none; -webkit-appearance: none; appearance: none;
}
.inp:focus, .field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 > * { min-width: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; inset: 0; }
.seg-opt span { display: grid; place-items: center; min-height: 46px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 15px; color: var(--muted); }
.seg-opt input:checked + span { color: var(--bg); background: var(--text); border-color: var(--text); }
.seg-opt.prio-muss input:checked + span { background: var(--muss); border-color: var(--muss); }
.seg-opt.prio-soll input:checked + span { background: var(--soll); border-color: var(--soll); }
.seg-opt.prio-kann input:checked + span { background: var(--kann); border-color: var(--kann); }
.seg-opt.cat-dienst input:checked + span { background: var(--dienst); border-color: var(--dienst); }
.seg-opt.cat-lernen input:checked + span { background: var(--lernen); border-color: var(--lernen); }
.seg-opt.cat-training input:checked + span { background: var(--training); border-color: var(--training); }
.seg-opt.cat-privat input:checked + span { background: var(--privat); border-color: var(--privat); }
.seg-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: -4px; }
.presets button { min-height: 38px; min-width: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; padding: 0 12px; }
.check-row { display: flex; align-items: center; gap: 12px; min-height: 48px; margin: 6px 0; font-size: 15px; }
.check-row input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
.addons { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
.addons button { min-height: 40px; border-radius: 999px; border: 1px dashed var(--line); background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; }

/* Checkliste */
.cl-list { display: flex; flex-direction: column; gap: 6px; }
.cl-row { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 2px 2px 2px 4px; }
.cl-check { position: relative; width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.cl-check input { position: absolute; inset: 0; opacity: 0; margin: 0; }
.cl-check span { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; }
.cl-check input:checked + span { background: var(--ok); border-color: var(--ok); }
.cl-check input:checked + span::after { content: ''; width: 10px; height: 5px; border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink); transform: translateY(-2px) rotate(-45deg); }
.cl-text { flex: 1; min-width: 0; min-height: 44px; background: none; border: 0; outline: none; font-size: 16px; padding: 6px 4px; }
.cl-row.done .cl-text { text-decoration: line-through; color: var(--muted); }
.cl-row .icon-btn { background: none; color: var(--muted); }
.cl-add { display: flex; gap: 8px; margin-top: 8px; }
.cl-add .inp { flex: 1; }

/* Anhänge */
.att-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.att { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 4px 4px 4px 0; }
.att-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 10px 12px; min-height: 44px; }
.att-open .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .icon-btn { background: var(--surface-3); width: 40px; height: 40px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

/* Links */
.lk { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 60px; overflow: hidden; }
.lk a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 0 8px 10px; text-decoration: none; color: var(--text); }
.lk .av { width: 40px; height: 40px; border-radius: 12px; font-size: 15px; display: grid; place-items: center; font-weight: 800; color: #0b0d10; flex: none; }
.lk .lm { min-width: 0; display: flex; flex-direction: column; }
.lk .lm b, .lk .lm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lk .lm span { color: var(--muted); font-size: 13px; }
.lk .icon-btn { background: none; color: var(--muted); margin-right: 6px; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 30; background: #000; display: flex; flex-direction: column; }
.viewer-head { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 8px) 10px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.viewer-head .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.viewer-body { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding-bottom: var(--safe-b); }
.viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.viewer-body pre { white-space: pre-wrap; overflow-wrap: anywhere; align-self: stretch; margin: 0; padding: 16px; width: 100%; color: var(--text); font-size: 14px; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + 92px); transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 15px; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; gap: 12px; align-items: center; }
#toast button { background: none; border: 0; color: var(--accent-ink); font-weight: 800; text-decoration: underline; padding: 4px; }
@media (min-width: 760px) { .sheet { border-radius: 22px; bottom: 20px; border: 1px solid var(--line); } }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Heute</h1>
  <div class="sub" id="subtitle"></div>
</header>
<main id="main" aria-live="polite"></main>

<button class="fab" id="fab" aria-label="Neu"><svg class="i"><use href="#i-plus"/></svg></button>

<nav class="tabs" aria-label="Bereiche">
  <button data-view="heute"><svg class="i"><use href="#i-sun"/></svg>Heute</button>
  <button data-view="termine"><svg class="i"><use href="#i-cal"/></svg>Termine</button>
  <button data-view="aufgaben"><svg class="i"><use href="#i-check"/></svg>Aufgaben</button>
  <button data-view="mehr"><svg class="i"><use href="#i-more"/></svg>Mehr</button>
</nav>

<div id="sheet-root" hidden></div>
<div id="viewer" hidden></div>
<div id="toast" hidden role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
</svg>

<script>
'use strict';
/* ==========================================================================
   Kommandozentrum – schlicht: Heute, Termine, Aufgaben, Links.
   Datenhaltung: localStorage (Struktur) + IndexedDB (Anhänge). Nichts verlässt das Gerät.
   ========================================================================== */
const APP_VERSION = '3.0.0';
const LS_KEY = 'kz:data:v1';
const BACKUP_FORMAT = 'kommandozentrum-backup';
const PBKDF2_ITER = 600000;
const BIG_FILE = 25 * 1024 * 1024;     // Warnschwelle für Anhänge

const PRIO = { muss: 'Muss', soll: 'Soll', kann: 'Kann' };
const PRIO_RANK = { muss: 0, soll: 1, kann: 2 };
const CATS = { dienst: 'Dienst', lernen: 'Lernen', training: 'Training', privat: 'Privat' };
const CLASSIFIED_HINT = 'Nur auf diesem Gerät gespeichert. Keine eingestuften Dokumente (z. B. VS-NfD) ablegen.';

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = (n) => String(n).padStart(2, '0');
const icon = (name, cls = '') => `<svg class="i ${cls}"><use href="#i-${name}"/></svg>`;
const dateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const parseDate = (ds) => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (ds, n) => { const d = parseDate(ds); d.setDate(d.getDate() + n); return dateStr(d); };
const toDateTime = (ds, hm) => { const d = parseDate(ds); if (hm) { const [h, mi] = hm.split(':').map(Number); d.setHours(h, mi, 0, 0); } return d; };
const toMin = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = (s) => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);
const str = (s, max = 5000) => (typeof s === 'string' ? s : '').slice(0, max);
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function fmtDateLabel(ds) {
  const t = todayStr();
  if (ds === t) return 'Heute';
  if (ds === addDays(t, 1)) return 'Morgen';
  if (ds === addDays(t, -1)) return 'Gestern';
  return parseDate(ds).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short', year: ds.slice(0, 4) === t.slice(0, 4) ? undefined : 'numeric' });
}
const fmtLong = (ds) => parseDate(ds).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: ds.slice(0, 4) === todayStr().slice(0, 4) ? undefined : 'numeric' });
function fmtAgo(ms) {
  const d = Math.floor((Date.now() - ms) / 86400000);
  return d <= 0 ? 'heute' : d === 1 ? 'gestern' : `vor ${d} Tagen`;
}
function fmtSize(b) {
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(0)} KB`;
  return `${(b / 1024 / 1024).toFixed(1).replace('.', ',')} MB`;
}
function bufToB64(buf) {
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBuf(b64) {
  const s = atob(b64); const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out.buffer;
}
// Route vom aktuellen Standort – Apple Karten rechnet die Fahrzeit selbst
const mapsUrl = (location) => `https://maps.apple.com/?daddr=${encodeURIComponent(location)}`;
const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, '') || url; } catch (_) { return url; } };
// Nur Web-, Telefon- und Mail-Adressen zulassen (kein javascript:, data: …)
function cleanUrl(u) {
  let v = String(u || '').trim();
  if (!v) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
  try { const x = new URL(v); return ['https:', 'http:', 'tel:', 'mailto:'].includes(x.protocol) ? x.href.slice(0, 2000) : ''; } catch (_) { return ''; }
}

/* ---------- Zustand (localStorage) ---------- */
function defaultState() {
  return { version: 3, tasks: [], events: [], links: [], settings: { taskCat: 'alle', showDone: false, showPast: false, lastExport: 0 } };
}
const cleanId = (v) => (typeof v === 'string' && v ? v.slice(0, 80) : null);
const cleanChecklist = (cl) => (Array.isArray(cl) ? cl : []).filter((x) => x && typeof x === 'object' && str(x.text).trim()).slice(0, 50)
  .map((x) => ({ id: cleanId(x.id) || uid(), text: str(x.text, 200).trim(), done: !!x.done }));
function cleanTask(t) {
  if (!t || typeof t !== 'object' || !cleanId(t.id)) return null;
  // Ältere Versionen: „eingeplanter Tag“ wird zum Fälligkeitstag, wenn keiner gesetzt ist
  const due = isDate(t.due) ? t.due : isDate(t.planDate) ? t.planDate : '';
  const dueTime = isDate(t.due) ? t.dueTime : isDate(t.planDate) ? t.planStart : '';
  return {
    id: cleanId(t.id), title: str(t.title, 300) || '(ohne Titel)',
    prio: PRIO[t.prio] ? t.prio : 'soll', cat: CATS[t.cat] ? t.cat : 'privat',
    due, dueTime: due && isTime(dueTime) ? dueTime : '', location: str(t.location, 300).trim(),
    notes: str(t.notes), done: !!t.done, doneAt: Number(t.doneAt) || 0, created: Number(t.created) || Date.now(),
    checklist: cleanChecklist(t.checklist)
  };
}
function cleanEvent(e) {
  if (!e || typeof e !== 'object' || !cleanId(e.id) || !isDate(e.date)) return null;
  return {
    id: cleanId(e.id), title: str(e.title, 300) || '(ohne Titel)', date: e.date,
    start: isTime(e.start) ? e.start : '', end: isTime(e.start) && isTime(e.end) ? e.end : '',
    location: str(e.location, 300).trim(), notes: str(e.notes), created: Number(e.created) || Date.now()
  };
}
function cleanLink(l) {
  if (!l || typeof l !== 'object' || !cleanId(l.id)) return null;
  const url = cleanUrl(l.url);
  if (!url) return null;
  return { id: cleanId(l.id), title: str(l.title, 100).trim() || hostOf(url), url };
}
function normalize(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const arr = (a, fn) => (Array.isArray(a) ? a : []).map(fn).filter(Boolean);
  d.tasks = arr(s.tasks, cleanTask);
  d.events = arr(s.events, cleanEvent);
  d.links = arr(s.links, cleanLink);
  const st = s.settings || {};
  d.settings.taskCat = CATS[st.taskCat] ? st.taskCat : 'alle';
  d.settings.showDone = !!st.showDone;
  d.settings.showPast = !!st.showPast;
  d.settings.lastExport = Number(st.lastExport) || 0;
  return d;
}
function load() {
  let raw;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) { return defaultState(); }
  if (!raw) return defaultState();
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) {
    try { localStorage.setItem(LS_KEY + ':defekt:' + Date.now(), raw); } catch (_) {}
    return defaultState();
  }
  // Aus älteren Versionen (Routinen, Vorlagen, Orte) einmalig eine Kopie aufheben, bevor sie wegfallen
  if (parsed && (parsed.routines?.length || parsed.templates?.length || parsed.places?.length)) {
    try { if (!localStorage.getItem('kz:alt:v2')) localStorage.setItem('kz:alt:v2', raw); } catch (_) {}
  }
  return normalize(parsed);
}
let state = load();
let persistAsked = false;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('Speichern fehlgeschlagen: ' + e.message); }
  if (!persistAsked && navigator.storage && navigator.storage.persist) { persistAsked = true; navigator.storage.persist().catch(() => {}); }
}

/* ---------- Anhänge (IndexedDB) ---------- */
const Files = (() => {
  let dbp;
  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function db() {
    return dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('kz-anhaenge', 1);
      r.onupgradeneeded = () => { const s = r.result.createObjectStore('files', { keyPath: 'id' }); s.createIndex('owner', 'ownerId'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbp = null; rej(r.error); };
    }));
  }
  const store = async (mode) => (await db()).transaction('files', mode).objectStore('files');
  return {
    async add(meta, data) { const rec = { ...meta, id: uid(), created: Date.now(), data }; await req((await store('readwrite')).put(rec)); return rec.id; },
    async put(rec) { await req((await store('readwrite')).put(rec)); },
    async get(id) { return req((await store('readonly')).get(id)); },
    async byOwner(ownerId) { return req((await store('readonly')).index('owner').getAll(ownerId)); },
    async all() { return req((await store('readonly')).getAll()); },
    async del(id) { await req((await store('readwrite')).delete(id)); },
    async delOwner(ownerId) { for (const f of await this.byOwner(ownerId)) await this.del(f.id); },
    async clear() { await req((await store('readwrite')).clear()); },
    async ownerCounts() {
      const idx = (await store('readonly')).index('owner');
      return new Promise((res, rej) => {
        const counts = {}; const c = idx.openKeyCursor();
        c.onsuccess = () => { const cur = c.result; if (!cur) return res(counts); counts[cur.key] = (counts[cur.key] || 0) + 1; cur.continue(); };
        c.onerror = () => rej(c.error);
      });
    }
  };
})();
let attCounts = {};
async function refreshAttCounts() { try { attCounts = await Files.ownerCounts(); } catch (e) { attCounts = {}; } }
const attBadge = (id) => attCounts[id] ? `<span>${icon('clip', 'sm')} ${attCounts[id]}</span>` : '';

/* ---------- Domänenlogik ---------- */
const byEventTime = (a, b) => (a.date + (a.start || '00:00')).localeCompare(b.date + (b.start || '00:00'));
function byTaskOrder(a, b) {
  if (PRIO_RANK[a.prio] !== PRIO_RANK[b.prio]) return PRIO_RANK[a.prio] - PRIO_RANK[b.prio];
  const da = a.due ? a.due + (a.dueTime || '23:59') : '9999', db = b.due ? b.due + (b.dueTime || '23:59') : '9999';
  return da.localeCompare(db) || a.created - b.created;
}
const fmtDue = (t) => `${fmtDateLabel(t.due)}${t.dueTime ? ', ' + t.dueTime : ''}`;
function isOverdue(t) {
  if (t.done || !t.due) return false;
  if (t.dueTime) return toDateTime(t.due, t.dueTime) < new Date();
  return t.due < todayStr();
}
const doneToday = (t) => t.done && t.doneAt && dateStr(new Date(t.doneAt)) === todayStr();
const defaultCat = () => (CATS[state.settings.taskCat] ? state.settings.taskCat : 'dienst');
// Früher eingegebene Orte als Vorschläge – ohne eigene Verwaltung
function knownLocations() {
  const seen = new Map();
  for (const x of [...state.events, ...state.tasks]) if (x.location && !seen.has(x.location.toLowerCase())) seen.set(x.location.toLowerCase(), x.location);
  return [...seen.values()].sort((a, b) => a.localeCompare(b, 'de')).slice(0, 80);
}
// Alles für einen Tag in einer Reihenfolge: überfällig → ganztägig → nach Uhrzeit → Aufgaben ohne Uhrzeit
function dayEntries(ds, withPastAndDone = false) {
  const entries = [
    ...state.events.filter((e) => e.date === ds).map((e) => ({ kind: 'event', ref: e, time: e.start })),
    ...state.tasks.filter((x) => x.due === ds && (!x.done || (withPastAndDone && doneToday(x)))).map((x) => ({ kind: 'task', ref: x, time: x.dueTime }))
  ];
  if (withPastAndDone) for (const x of state.tasks) if (x.due && x.due < ds && (!x.done || doneToday(x))) entries.push({ kind: 'task', ref: x, time: '', overdue: true });
  const rank = (en) => (en.overdue ? 0 : en.kind === 'event' && !en.time ? 1 : en.time ? 2 : 3);
  return entries.sort((a, b) => rank(a) - rank(b) || (a.time || '').localeCompare(b.time || '') || (a.kind === 'task' && b.kind === 'task' ? byTaskOrder(a.ref, b.ref) : 0));
}

/* ---------- Bausteine fürs Rendering ---------- */
let view = 'heute';
const main = $('#main');
const section = (title, body) => `<section class="section"><div class="section-h">${title}</div>${body}</section>`;
const navBtn = (loc) => `<a class="nav-btn" href="${esc(mapsUrl(loc))}" target="_blank" rel="noopener noreferrer" aria-label="Route zu ${esc(loc)} in Apple Karten">${icon('nav')}<span>Route</span></a>`;
function clBadge(t) {
  const n = t.checklist.filter((x) => x.done).length;
  return `<span class="${n === t.checklist.length ? 'ok' : ''}">${icon('check', 'sm')} ${n}/${t.checklist.length}</span>`;
}
function taskItem(t, showDate = true) {
  const meta = [];
  if (isOverdue(t)) meta.push(`<span class="warn">überfällig · ${esc(t.due === todayStr() ? t.dueTime : fmtDue(t))}</span>`);
  else if (showDate && t.due) meta.push(`<span>${icon('clock', 'sm')} ${esc(fmtDue(t))}</span>`);
  else if (t.dueTime) meta.push(`<span>${icon('clock', 'sm')} ${esc(t.dueTime)}</span>`);
  meta.push(`<span class="pill prio-${t.prio}">${PRIO[t.prio]}</span><span class="pill cat-${t.cat}">${CATS[t.cat]}</span>`);
  if (t.location) meta.push(`<span>${icon('pin', 'sm')} ${esc(t.location)}</span>`);
  if (t.checklist.length) meta.push(clBadge(t));
  meta.push(attBadge(t.id));
  return `<div class="item task prio-${t.prio}${t.done ? ' done' : ''}" data-task="${esc(t.id)}">
    <button class="check" data-act="toggle-task" aria-label="${t.done ? 'Als offen markieren' : 'Als erledigt markieren'}"><span class="box">${t.done ? icon('tick', 'sm') : ''}</span></button>
    <button class="item-main" data-act="edit-task"><span class="item-title">${esc(t.title)}</span><span class="meta">${meta.join('')}</span></button>
    ${t.location ? navBtn(t.location) : ''}
  </div>`;
}
function eventItem(ev) {
  const t = todayStr();
  const endMin = ev.end ? toMin(ev.end) : ev.start ? toMin(ev.start) + 60 : 24 * 60;
  const past = ev.date < t || (ev.date === t && endMin <= nowMin());
  const meta = (ev.location ? `<span>${icon('pin', 'sm')} ${esc(ev.location)}</span>` : '') + attBadge(ev.id);
  return `<div class="item event${past ? ' past' : ''}" data-event="${esc(ev.id)}">
    <div class="time-col">${ev.start ? `<span class="t-start">${esc(ev.start)}</span>${ev.end ? `<span class="t-end">${esc(ev.end)}</span>` : ''}` : '<span class="t-all">ganztags</span>'}</div>
    <button class="item-main" data-act="edit-event"><span class="item-title">${esc(ev.title)}</span>${meta ? `<span class="meta">${meta}</span>` : ''}</button>
    ${ev.location ? navBtn(ev.location) : ''}
  </div>`;
}
const entryItem = (en) => (en.kind === 'event' ? eventItem(en.ref) : taskItem(en.ref, false));

/* ---------- Ansichten ---------- */
function renderHeute() {
  const t = todayStr();
  const today = dayEntries(t, true);
  const tomorrow = dayEntries(addDays(t, 1));
  let html = today.length ? `<div class="list">${today.map(entryItem).join('')}</div>` : `<div class="empty">Heute steht nichts an.</div>`;
  html += section('Morgen', tomorrow.length ? `<div class="list">${tomorrow.map(entryItem).join('')}</div>` : `<p class="muted" style="margin:0 4px">Noch nichts geplant.</p>`);
  main.innerHTML = html;
}
function dayHeading(ds) {
  const t = todayStr();
  return ds === t ? `Heute · ${esc(fmtLong(ds))}` : ds === addDays(t, 1) ? `Morgen · ${esc(fmtLong(ds))}` : esc(fmtLong(ds));
}
function renderTermine() {
  const t = todayStr();
  const all = [...state.events].sort(byEventTime);
  const past = all.filter((e) => e.date < t);
  const list = state.settings.showPast ? all : all.filter((e) => e.date >= t);
  let html = '';
  if (!list.length) html += `<div class="empty">Keine anstehenden Termine.</div>`;
  const groups = new Map();
  for (const e of list) { if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); }
  for (const [d, evs] of groups) html += section(dayHeading(d), `<div class="list">${evs.map(eventItem).join('')}</div>`);
  if (past.length) html += `<div class="toggle-row"><button class="link-btn" data-act="toggle-past">${state.settings.showPast ? 'Vergangene ausblenden' : 'Vergangene Termine anzeigen'}</button></div>`;
  main.innerHTML = html;
}
function renderAufgaben() {
  const cat = state.settings.taskCat;
  const chips = [['alle', 'Alle'], ...Object.entries(CATS)].map(([k, l]) => `<button class="chip${cat === k ? ' on' : ''}" data-act="task-cat" data-cat="${k}">${l}</button>`).join('');
  const inCat = state.tasks.filter((x) => cat === 'alle' || x.cat === cat);
  const open = inCat.filter((x) => !x.done);
  let html = `<div class="chips" role="toolbar" aria-label="Kategorie">${chips}</div>`;
  if (!open.length) html += `<div class="empty" style="margin-top:10px">Keine offenen Aufgaben.</div>`;
  for (const p of Object.keys(PRIO)) {
    const items = open.filter((x) => x.prio === p).sort(byTaskOrder);
    if (items.length) html += section(PRIO[p], `<div class="list">${items.map((x) => taskItem(x)).join('')}</div>`);
  }
  const done = inCat.filter((x) => x.done).sort((a, b) => b.doneAt - a.doneAt);
  if (done.length) {
    if (state.settings.showDone) html += section('Erledigt', `<div class="list">${done.map((x) => taskItem(x)).join('')}</div>`);
    html += `<div class="toggle-row"><button class="link-btn" data-act="toggle-done">${state.settings.showDone ? 'Erledigte ausblenden' : 'Erledigte anzeigen'}</button>${state.settings.showDone ? `<button class="link-btn danger" data-act="purge-done">Erledigte löschen</button>` : ''}</div>`;
  }
  main.innerHTML = html;
}
const AV_COLORS = ['#4f9cff', '#b48cff', '#3ddc97', '#ff7ab6', '#ffb547', '#5ec8e5', '#ff8a5c'];
function linkAvatar(l) {
  const h = [...hostOf(l.url)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const w = l.title.trim().split(/\s+/).filter(Boolean);
  const ini = (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
  return `<span class="av" style="background:${AV_COLORS[h % AV_COLORS.length]}">${esc(ini)}</span>`;
}
const sortedLinks = () => [...state.links].sort((a, b) => a.title.localeCompare(b.title, 'de'));
const linkRow = (l) => `<div class="lk"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${linkAvatar(l)}<span class="lm"><b>${esc(l.title)}</b><span>${esc(hostOf(l.url))}</span></span></a><button type="button" class="icon-btn" data-act="edit-link" data-id="${esc(l.id)}" aria-label="${esc(l.title)} bearbeiten">${icon('edit', 'sm')}</button></div>`;
function renderMehr() {
  const links = sortedLinks();
  const hasDb = links.some((l) => hostOf(l.url).endsWith('bahn.de'));
  main.innerHTML = `
    ${section('Links', links.length ? `<div class="list">${links.map(linkRow).join('')}</div>` : `<div class="empty">Oft genutzte Seiten mit einem Tipp öffnen.</div>`)}
    <div class="toggle-row"><button class="link-btn" data-act="new-link">${icon('plus', 'sm')} Link hinzufügen</button>${hasDb ? '' : `<button class="link-btn" data-act="example-link">${icon('plus', 'sm')} Deutsche Bahn</button>`}</div>
    ${section('Daten', `<div class="card"><p class="muted">Alles bleibt auf diesem Gerät. Letzte Sicherung: <b>${state.settings.lastExport ? fmtAgo(state.settings.lastExport) : 'noch nie'}</b></p>
      <div class="btn-row"><button class="btn" data-act="export">${icon('share', 'sm')} Sichern</button><label class="btn file-btn">Wiederherstellen<input type="file" accept=".json,application/json" id="imp-file"></label></div></div>`)}
    <p class="muted small center" style="margin-top:28px">Kein Server, kein Konto, kein Tracking.<br>${esc(CLASSIFIED_HINT)}</p>
    <div class="toggle-row"><button class="link-btn danger" data-act="wipe">Alle Daten löschen</button></div>
    <p class="muted small center">Version ${APP_VERSION}</p>`;
  $('#imp-file').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };
}

const TITLES = { heute: 'Heute', termine: 'Termine', aufgaben: 'Aufgaben', mehr: 'Mehr' };
function render() {
  $('#title').textContent = TITLES[view];
  const sub = $('#subtitle');
  sub.textContent = view === 'heute' ? fmtLong(todayStr()) : '';
  sub.hidden = view !== 'heute';
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  el.hidden = false;
  if (action) el.querySelector('button').onclick = () => { el.hidden = true; action.fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 2600);
}

/* ---------- Sheets ---------- */
const sheetRoot = $('#sheet-root');
let sheetOnClose = null;
function openSheet(inner, onClose) {
  if (!sheetRoot.hidden) closeSheet();
  sheetRoot.innerHTML = `<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  sheetRoot.hidden = false;
  document.body.classList.add('noscroll');
  sheetOnClose = onClose || null;
  sheetRoot.querySelector('.backdrop').onclick = () => closeSheet();
  sheetRoot.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => closeSheet(); });
  return sheetRoot.querySelector('.sheet');
}
function closeSheet(saved = false) {
  if (sheetRoot.hidden) return;
  const cb = sheetOnClose; sheetOnClose = null;
  sheetRoot.hidden = true; sheetRoot.innerHTML = '';
  document.body.classList.remove('noscroll');
  if (cb) cb(saved);
}
const sheetHead = (title) => `<div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Schließen">${icon('x')}</button></div>`;
const seg = (name, opts, val, prefix) => `<div class="seg" role="radiogroup">${Object.entries(opts).map(([k, l]) => `<label class="seg-opt ${prefix}-${k}"><input type="radio" name="${name}" value="${k}"${k === val ? ' checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div>`;
const locField = () => `<label class="field"><span>Ort (optional)</span><input name="location" list="loc-dl" autocomplete="off" maxlength="300" placeholder="Adresse oder Ort">
  <datalist id="loc-dl">${knownLocations().map((l) => `<option value="${esc(l)}">`).join('')}</datalist></label>
  <a class="link-btn" data-route target="_blank" rel="noopener noreferrer" style="margin-top:-8px">${icon('nav', 'sm')} Route in Apple Karten</a>`;
function bindLocField(form) {
  const inp = form.elements.location, a = form.querySelector('[data-route]');
  const upd = () => { const v = inp.value.trim(); a.hidden = !v; if (v) a.href = mapsUrl(v); };
  inp.addEventListener('input', upd); upd();
}
// Selten gebrauchte Felder erst auf Wunsch einblenden
function bindAddons(sheet) {
  const box = sheet.querySelector('.addons');
  const refresh = () => { box.hidden = !box.querySelector('button:not([hidden])'); };
  box.onclick = (e) => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    const blk = sheet.querySelector(`[data-opt="${b.dataset.add}"]`);
    blk.hidden = false; b.hidden = true; refresh();
    const f = blk.querySelector('input:not([type=file]):not([type=checkbox]), textarea'); if (f) f.focus();
  };
  refresh();
}
const addon = (key, label, open) => `<button type="button" data-add="${key}"${open ? ' hidden' : ''}>${icon('plus', 'sm')} ${label}</button>`;

/* ---------- Anhänge im Editor ---------- */
const attSection = (open) => `<div class="field" data-opt="att"${open ? '' : ' hidden'}><span class="field-label">Anhänge</span>
  <div class="att-list" data-att-list></div>
  <label class="btn block file-btn">${icon('clip')} Datei hinzufügen<input type="file" multiple data-att-input></label>
  <p class="muted small" style="margin:6px 2px 0">${esc(CLASSIFIED_HINT)}</p></div>`;
function bindAttachments(sheet, ownerType, ownerId, added) {
  const list = sheet.querySelector('[data-att-list]');
  const input = sheet.querySelector('[data-att-input]');
  async function refresh() {
    let files = [];
    try { files = await Files.byOwner(ownerId); } catch (e) { list.innerHTML = '<div class="muted small">Anhänge nicht verfügbar.</div>'; return; }
    files.sort((a, b) => a.created - b.created);
    list.innerHTML = files.map((f) => `<div class="att" data-id="${esc(f.id)}">
        <button type="button" class="att-open" data-att="open">${icon('file', 'sm')}<span class="nm">${esc(f.name)}</span><span class="muted small">${fmtSize(f.size)}</span></button>
        <button type="button" class="icon-btn" data-att="share" aria-label="Teilen oder sichern">${icon('share', 'sm')}</button>
        <button type="button" class="icon-btn" data-att="del" aria-label="Anhang entfernen">${icon('trash', 'sm')}</button>
      </div>`).join('');
  }
  input.onchange = async () => {
    for (const file of [...input.files]) {
      if (file.size > BIG_FILE && !confirm(`„${file.name}“ ist ${fmtSize(file.size)} groß. Trotzdem speichern?`)) continue;
      try {
        const id = await Files.add({ ownerType, ownerId, name: file.name.slice(0, 200), type: file.type || 'application/octet-stream', size: file.size }, await file.arrayBuffer());
        added.push(id);
      } catch (e) { toast('Anhang konnte nicht gespeichert werden: ' + (e && e.message || e)); }
    }
    input.value = '';
    await refreshAttCounts();
    refresh();
  };
  list.onclick = async (e) => {
    const b = e.target.closest('[data-att]'); if (!b) return;
    const id = b.closest('.att').dataset.id;
    if (b.dataset.att === 'open') openViewer(id);
    else if (b.dataset.att === 'share') { const f = await Files.get(id); if (f) shareOrDownload(fileBlob(f), f.name); }
    else if (b.dataset.att === 'del') {
      if (!confirm('Anhang entfernen?')) return;
      await Files.del(id); await refreshAttCounts(); refresh();
    }
  };
  refresh();
}
const SAFE_PREVIEW = /^(image\/(png|jpe?g|gif|webp|heic|heif|avif|bmp)|application\/pdf|text\/plain)$/i;
// Unbekannte Typen (z. B. HTML/SVG) nie mit ihrem Typ im App-Ursprung öffnen.
const fileBlob = (f) => new Blob([f.data], { type: SAFE_PREVIEW.test(f.type) ? f.type : 'application/octet-stream' });
let viewerUrl = null;
async function openViewer(id) {
  const f = await Files.get(id); if (!f) return;
  const v = $('#viewer');
  let body;
  if (/^image\//i.test(f.type) && SAFE_PREVIEW.test(f.type)) { viewerUrl = URL.createObjectURL(fileBlob(f)); body = `<img src="${viewerUrl}" alt="${esc(f.name)}">`; }
  else if (/^application\/pdf$/i.test(f.type)) { viewerUrl = URL.createObjectURL(fileBlob(f)); body = `<iframe src="${viewerUrl}" title="${esc(f.name)}"></iframe>`; }
  else if (/^text\/plain$/i.test(f.type)) body = `<pre></pre>`;
  else body = `<div class="muted" style="padding:24px;text-align:center">Für diesen Dateityp gibt es keine Vorschau.<br>Über „Teilen“ in einer passenden App öffnen.</div>`;
  v.innerHTML = `<div class="viewer-head"><button class="icon-btn" data-v="close" aria-label="Schließen">${icon('x')}</button><span class="nm">${esc(f.name)}</span><button class="icon-btn" data-v="share" aria-label="Teilen">${icon('share')}</button></div><div class="viewer-body">${body}</div>`;
  if (/^text\/plain$/i.test(f.type)) v.querySelector('pre').textContent = new TextDecoder().decode(f.data);
  v.hidden = false;
  v.onclick = (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    if (b.dataset.v === 'close') { v.hidden = true; v.innerHTML = ''; if (viewerUrl) URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
    else shareOrDownload(fileBlob(f), f.name);
  };
}

/* ---------- Teilen / Herunterladen (lokal) ---------- */
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && (isIOS() || /Android/i.test(navigator.userAgent))) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
// Nach langen asynchronen Schritten (Verschlüsselung) ist die Nutzergeste abgelaufen → eigener Tipp nötig.
function offerFile(blob, name, info) {
  const sheet = openSheet(`${sheetHead('Sicherung bereit')}<div class="sheet-body"><p>${esc(name)}<br><span class="muted small">${fmtSize(blob.size)}${info ? ' · ' + esc(info) : ''}</span></p><p class="muted small">Am besten in der Dateien-App ablegen – nicht ins GitHub-Repository.</p></div>
    <div class="sheet-foot"><button type="button" class="btn primary" data-go>${icon('share')} Sichern / Teilen</button></div>`);
  sheet.querySelector('[data-go]').onclick = async () => { await shareOrDownload(blob, name); closeSheet(); };
}

/* ---------- Aufgaben-Editor ---------- */
function editTask(id) {
  const existing = state.tasks.find((t) => t.id === id);
  const isNew = !existing;
  const t = existing ? { ...existing } : { id: uid(), title: '', prio: 'soll', cat: defaultCat(), due: '', dueTime: '', location: '', notes: '', done: false, doneAt: 0, created: Date.now(), checklist: [] };

      <label class="field"><span>Was ist zu tun?</span><input name="title" value="${esc(t.title)}" autocomplete="off" enterkeyhint="done" maxlength="300"></label>

      <div class="field"><span class="field-label">Kategorie</span>${seg('cat', CATS, t.cat, 'cat')}</div>
      <div class="row2">
        <label class="field"><span>Fällig am</span><input type="date" name="due" value="${esc(t.due)}"></label>
        <label class="field"><span>Uhrzeit (optional)</span><input type="time" name="dueTime" value="${esc(t.dueTime)}"></label>
      </div>
      <div class="presets" data-due-presets><button type="button" data-d="0">Heute</button><button type="button" data-d="1">Morgen</button><button type="button" data-d="7">In 1 Woche</button><button type="button" data-d="">Ohne Datum</button></div>
      <div data-opt="loc"${t.location ? '' : ' hidden'}>${locField()}</div>
      <div class="field" data-opt="cl"${t.checklist.length ? '' : ' hidden'}><span class="field-label">Checkliste</span>
        <div class="cl-list" data-cl></div>
        <div class="cl-add"><input class="inp" data-cl-new placeholder="Punkt hinzufügen" autocomplete="off" enterkeyhint="enter" maxlength="200" aria-label="Neuer Punkt"><button type="button" class="icon-btn" data-cl-add aria-label="Punkt hinzufügen">${icon('plus')}</button></div></div>
      <label class="field" data-opt="notes"${t.notes ? '' : ' hidden'}><span>Notiz</span><textarea name="notes" rows="3">${esc(t.notes)}</textarea></label>
      ${attSection(hasAtt)}
      <div class="addons">${addon('loc', 'Ort', !!t.location)}${addon('cl', 'Checkliste', t.checklist.length > 0)}${addon('notes', 'Notiz', !!t.notes)}${addon('att', 'Anhang', hasAtt)}</div>
    </div>
    <div class="sheet-foot">${isNew ? '' : `<button type="button" class="btn danger" data-del aria-label="Löschen">${icon('trash')}</button>`}<button type="submit" class="btn primary">Speichern</button></div>
  </form>`, (saved) => {
    if (!saved && isNew && added.length) Files.delOwner(t.id).then(refreshAttCounts);
    if (!saved && existing) render();   // Checklisten-Haken werden sofort gespeichert
  });
  const form = sheet.querySelector('form');
  const el = form.elements;
  el.location.value = t.location;
  if (isNew) setTimeout(() => el.title.focus(), 250);
  bindLocField(form);
  bindAddons(sheet);
  sheet.querySelector('[data-due-presets]').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    el.due.value = b.dataset.d === '' ? '' : addDays(todayStr(), Number(b.dataset.d));
    if (b.dataset.d === '') el.dueTime.value = '';
  };
  // Checkliste
  const cl = t.checklist.map((x) => ({ ...x }));
  const clBox = sheet.querySelector('[data-cl]');
  const clNew = sheet.querySelector('[data-cl-new]');
  const renderCl = () => {
    clBox.innerHTML = cl.map((x, i) => `<div class="cl-row${x.done ? ' done' : ''}" data-i="${i}"><label class="cl-check"><input type="checkbox"${x.done ? ' checked' : ''} aria-label="Erledigt"><span></span></label><input class="cl-text" value="${esc(x.text)}" maxlength="200" aria-label="Punkt"><button type="button" class="icon-btn" data-rm aria-label="Punkt entfernen">${icon('trash', 'sm')}</button></div>`).join('');
  };
  const addCl = () => { const v = clNew.value.trim(); if (!v) return; cl.push({ id: uid(), text: v, done: false }); clNew.value = ''; renderCl(); clNew.focus(); };
  clNew.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addCl(); } });
  sheet.querySelector('[data-cl-add]').onclick = addCl;
  clBox.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); clNew.focus(); } });
  clBox.addEventListener('input', (e) => { if (e.target.classList.contains('cl-text')) cl[e.target.closest('.cl-row').dataset.i].text = e.target.value; });
  clBox.addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (b) { cl.splice(Number(b.closest('.cl-row').dataset.i), 1); renderCl(); } });

    const row = e.target.closest('.cl-row');
    const item = cl[row.dataset.i];
    item.done = e.target.checked;
    row.classList.toggle('done', item.done);
    if (!existing) return;
    // Haken sofort speichern – praktisch beim Abarbeiten, auch ohne „Speichern“
    const stored = state.tasks.find((x) => x.id === existing.id);
    const si = stored && stored.checklist.find((x) => x.id === item.id);
    if (si) { si.done = item.done; save(); }
    if (stored && !stored.done && cl.every((x) => x.done)) toast('Alle Punkte erledigt', { label: 'Aufgabe abhaken', fn: () => { stored.done = true; stored.doneAt = Date.now(); save(); closeSheet(true); render(); } });

  bindAttachments(sheet, 'task', t.id, added);

    e.preventDefault();

    });

    save(); closeSheet(true); render();
    toast(isNew ? 'Aufgabe angelegt' : 'Gespeichert');
  };
  const del = sheet.querySelector('[data-del]');
  if (del) del.onclick = () => {
    if (!confirm('Aufgabe löschen?')) return;
    state.tasks = state.tasks.filter((x) => x.id !== t.id);
    save(); Files.delOwner(t.id).then(refreshAttCounts);
    closeSheet(true); render(); toast('Aufgabe gelöscht');
  };
}
function toggleTask(id) {
  const t = state.tasks.find((x) => x.id === id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : 0;
  save(); render();
  if (t.done) toast('Erledigt', { label: 'Rückgängig', fn: () => { t.done = false; t.doneAt = 0; save(); render(); } });
}

/* ---------- Kalenderdatei (.ics, lokal erzeugt) ---------- */
function buildIcs(ev) {
  const icsEsc = (x) => String(x || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const dt = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const n = new Date();
  const stamp = `${n.getUTCFullYear()}${pad(n.getUTCMonth() + 1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}${pad(n.getUTCSeconds())}Z`;
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kommandozentrum//DE', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', `UID:${ev.id}@kommandozentrum.local`, `DTSTAMP:${stamp}`];
  if (ev.start) {
    const s = toDateTime(ev.date, ev.start);
    let e = ev.end ? toDateTime(ev.date, ev.end) : new Date(s.getTime() + 3600000);
    if (e <= s) e = new Date(s.getTime() + 3600000);
    lines.push(`DTSTART:${dt(s)}`, `DTEND:${dt(e)}`);
  } else {
    lines.push(`DTSTART;VALUE=DATE:${ev.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(ev.date, 1).replace(/-/g, '')}`);
  }
  lines.push(`SUMMARY:${icsEsc(ev.title)}`);
  if (ev.location) lines.push(`LOCATION:${icsEsc(ev.location)}`);
  if (ev.notes) lines.push(`DESCRIPTION:${icsEsc(ev.notes)}`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  // Zeilen > 75 Zeichen falten (RFC 5545)
  return lines.map((l) => { let out = ''; while (l.length > 74) { out += l.slice(0, 74) + '\r\n '; l = l.slice(74); } return out + l; }).join('\r\n') + '\r\n';
}

/* ---------- Sichern / Wiederherstellen ---------- */
async function deriveKey(pw, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function showExport() {
  const sheet = openSheet(`<form novalidate>${sheetHead('Daten sichern')}
    <div class="sheet-body">
      <label class="check-row"><input type="checkbox" name="att"> Anhänge mitsichern</label>
      <label class="check-row"><input type="checkbox" name="enc"> ${icon('lock', 'sm')} Mit Passwort verschlüsseln</label>
      <div data-pw hidden>
        <label class="field"><span>Passwort (mind. 8 Zeichen)</span><input type="password" name="pw1" autocomplete="new-password"></label>
        <label class="field"><span>Passwort wiederholen</span><input type="password" name="pw2" autocomplete="new-password"></label>
        <p class="muted small">Ohne Passwort lässt sich die Sicherung nicht wiederherstellen.</p>
      </div>
    </div>
    <div class="sheet-foot"><button type="submit" class="btn primary">Sicherung erstellen</button></div></form>`);
  const form = sheet.querySelector('form');
  const el = form.elements;
  el.enc.onchange = () => { sheet.querySelector('[data-pw]').hidden = !el.enc.checked; };
  form.onsubmit = (e) => { e.preventDefault(); exportBackup(el.att.checked, el.enc.checked ? el.pw1.value : null, el.pw2.value); };
}
async function exportBackup(withAtt, pw, pw2) {
  if (pw != null) {
    if (pw.length < 8) { toast('Passwort: mindestens 8 Zeichen'); return; }
    if (pw !== pw2) { toast('Passwörter stimmen nicht überein'); return; }
    if (!crypto.subtle) { toast('Verschlüsselung nur über HTTPS verfügbar'); return; }
  }
  toast(pw != null ? 'Verschlüssele …' : 'Erzeuge Sicherung …');
  try {
    state.settings.lastExport = Date.now();
    const payload = { app: 'kommandozentrum', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), state, attachments: null };
    if (withAtt) payload.attachments = (await Files.all()).map((f) => ({ id: f.id, ownerType: f.ownerType, ownerId: f.ownerId, name: f.name, type: f.type, size: f.size, created: f.created, data: bufToB64(f.data) }));
    let out;
    if (pw != null) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(pw, salt, PBKDF2_ITER);
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(payload)));
      out = { format: BACKUP_FORMAT, formatVersion: 1, encrypted: true, kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: PBKDF2_ITER, salt: bufToB64(salt) }, cipher: { name: 'AES-GCM', iv: bufToB64(iv) }, data: bufToB64(ct) };
    } else {
      out = { format: BACKUP_FORMAT, formatVersion: 1, encrypted: false, payload };
    }
    save();
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const name = `kommandozentrum-backup-${todayStr()}${pw != null ? '-verschluesselt' : ''}.json`;
    offerFile(blob, name, `${withAtt ? 'mit' : 'ohne'} Anhänge${pw != null ? ', verschlüsselt' : ', unverschlüsselt'}`);
    render();
  } catch (e) { toast('Sichern fehlgeschlagen: ' + (e && e.message || e)); }
}
function askPassword(title) {
  return new Promise((resolve) => {
    let done = false;
    const sheet = openSheet(`<form novalidate>${sheetHead(title)}<div class="sheet-body">
      <label class="field"><span>Passwort</span><input type="password" name="pw" autocomplete="current-password"></label></div>
      <div class="sheet-foot"><button type="submit" class="btn primary">Entschlüsseln</button></div></form>`, () => { if (!done) resolve(null); });
    const form = sheet.querySelector('form');
    setTimeout(() => form.elements.pw.focus(), 250);
    form.onsubmit = (e) => { e.preventDefault(); done = true; const v = form.elements.pw.value; closeSheet(true); resolve(v); };
  });
}
async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (_) { toast('Keine gültige Sicherungsdatei'); return; }
  if (!obj || obj.format !== BACKUP_FORMAT) { toast('Unbekanntes Format'); return; }
  let payload;
  if (obj.encrypted) {
    const pw = await askPassword('Sicherung entschlüsseln');
    if (pw == null) return;
    toast('Entschlüssele …');
    try {
      const key = await deriveKey(pw, b64ToBuf(obj.kdf.salt), Number(obj.kdf.iterations) || PBKDF2_ITER);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(obj.cipher.iv) }, key, b64ToBuf(obj.data));
      payload = JSON.parse(new TextDecoder().decode(pt));
    } catch (_) { toast('Falsches Passwort oder beschädigte Datei'); return; }
  } else payload = obj.payload;
  if (!payload || !payload.state) { toast('Sicherung enthält keine Daten'); return; }
  const s = normalize(payload.state);
  const atts = Array.isArray(payload.attachments) ? payload.attachments : null;
  const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('de-DE') : 'unbekannt';
  if (!confirm(`Sicherung vom ${when} wiederherstellen?\n\n${s.tasks.length} Aufgaben, ${s.events.length} Termine, ${s.links.length} Links${atts ? `, ${atts.length} Anhänge` : ''}.\n\nDie aktuellen Daten auf diesem Gerät werden ERSETZT.`)) return;
  try {
    if (atts) {
      await Files.clear();
      for (const a of atts) {
        if (!a || typeof a.id !== 'string' || typeof a.data !== 'string') continue;
        await Files.put({ id: a.id, ownerType: str(a.ownerType, 10), ownerId: str(a.ownerId, 80), name: str(a.name, 200) || 'Datei', type: str(a.type, 100) || 'application/octet-stream', size: Number(a.size) || 0, created: Number(a.created) || Date.now(), data: b64ToBuf(a.data) });
      }
    } else {
      // Sicherung ohne Anhänge: vorhandene Anhänge behalten, sofern ihr Eintrag noch existiert
      const ids = new Set([...s.tasks.map((t) => t.id), ...s.events.map((e) => e.id)]);
      for (const f of await Files.all()) if (!ids.has(f.ownerId)) await Files.del(f.id);
    }
  } catch (e) { toast('Anhänge konnten nicht wiederhergestellt werden: ' + (e && e.message || e)); }
  state = s; save();
  await refreshAttCounts();
  render(); toast('Wiederhergestellt');
}
async function wipeAll() {
  if (!confirm('Wirklich ALLE Aufgaben, Termine, Links und Anhänge auf diesem Gerät löschen?')) return;
  if (!confirm('Letzte Warnung: Das kann nicht rückgängig gemacht werden. Vorher gesichert?')) return;
  state = defaultState();
  try { await Files.clear(); } catch (_) {}
  for (const k of Object.keys(localStorage)) if (k.startsWith('kz:')) localStorage.removeItem(k);
  save();
  await refreshAttCounts();
  setView('heute'); toast('Alle Daten gelöscht');
}

/* ---------- Ereignisse ---------- */
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });
// Plus: auf „Heute“ Auswahl, sonst direkt das Passende
$('#fab').addEventListener('click', () => ({ heute: chooseNew, termine: () => editEvent(null), aufgaben: () => editTask(null), mehr: () => editLink(null) })[view]());
main.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const taskId = b.closest('[data-task]')?.dataset.task;
  const evId = b.closest('[data-event]')?.dataset.event;
  switch (b.dataset.act) {
    case 'toggle-task': toggleTask(taskId); break;
    case 'edit-task': editTask(taskId); break;
    case 'edit-event': editEvent(evId); break;
    case 'task-cat': state.settings.taskCat = b.dataset.cat; save(); render(); break;
    case 'toggle-done': state.settings.showDone = !state.settings.showDone; save(); render(); break;
    case 'toggle-past': state.settings.showPast = !state.settings.showPast; save(); render(); break;
    case 'purge-done': {
      const cat = state.settings.taskCat;
      const del = state.tasks.filter((t) => t.done && (cat === 'alle' || t.cat === cat));
      if (!del.length || !confirm(`${del.length} erledigte Aufgaben endgültig löschen?`)) break;
      state.tasks = state.tasks.filter((t) => !del.includes(t));
      save(); Promise.all(del.map((t) => Files.delOwner(t.id))).then(refreshAttCounts); render(); break;
    }
    case 'edit-link': editLink(b.dataset.id); break;
    case 'new-link': editLink(null); break;
    case 'example-link': state.links.push(cleanLink({ id: uid(), title: 'Deutsche Bahn', url: 'https://www.bahn.de/' })); save(); render(); toast('Deutsche Bahn hinzugefügt'); break;
    case 'export': showExport(); break;
    case 'wipe': wipeAll(); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#viewer').hidden) $('#viewer [data-v=close]')?.click();
  else if (!sheetRoot.hidden) closeSheet();
});
window.addEventListener('storage', (e) => { if (e.key === LS_KEY) { state = load(); render(); } });
// Uhrzeit-abhängige Anzeigen (vergangen, überfällig, Tageswechsel) aktuell halten
setInterval(() => { if (sheetRoot.hidden && view !== 'mehr') render(); }, 60000);

/* ---------- Service Worker & Updates ---------- */
let swReg = null, lastSwCheck = Date.now();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
    swReg = reg;
    const offer = (w) => toast('Neue Version verfügbar', { label: 'Aktualisieren', fn: () => w.postMessage('skipWaiting') });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch(() => {});
  // Nur nach einem Update neu laden, nicht bei der Erstinstallation.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (sheetRoot.hidden) render();
  // Beim Zurückholen aus dem Hintergrund höchstens stündlich nach einer neuen Version sehen
  if (swReg && Date.now() - lastSwCheck > 3600000) { lastSwCheck = Date.now(); swReg.update().catch(() => {}); }
});

/* ---------- Start ---------- */
render();
refreshAttCounts().then(() => { if (sheetRoot.hidden) render(); });
</script>
</body>
</html>
